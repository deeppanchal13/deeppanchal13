name: GitHub-Profile-3D-Contrib

on:
  # Runs automatically twice a day (UTC). Odd minute on purpose: top-of-the-hour runs get delayed.
  schedule:
    - cron: "17 */12 * * *"
  # Lets you run it by hand: GitHub -> Actions -> GitHub-Profile-3D-Contrib -> Run workflow
  workflow_dispatch:

# The job pushes the generated SVGs back to the repo, so it needs write access to contents.
permissions:
  contents: write

# Never run two copies at once (prevents push conflicts).
concurrency:
  group: profile-3d-contrib
  cancel-in-progress: false

jobs:
  generate:
    name: generate-github-profile-3d-contrib
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          # Public contributions only. For private contributions, see SETUP.md (optional PAT).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated files (only if something changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No changes - nothing to commit."
          else
            git commit -m "chore: update 3D contribution graph [skip ci]"
            git push
          fi
# No `push` trigger exists in this workflow, and pushes made with GITHUB_TOKEN never start
# new workflow runs, so this can not loop.
