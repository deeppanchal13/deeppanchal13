from pathlib import Path
import re

src = Path("/mnt/data/Pasted text(3).txt").read_text(encoding="utf-8")

# Extract the six cards we want:
# 01 Cricket, 02 Chess, 03 Badminton, 04 Volleyball, 05 Music, 08 English.
# Then reposition the original 04 and 08 cards left by 211px and renumber them.
parts = re.findall(r'(<rect x="[^"]+" y="[^"]+" width="196" height="83"[^>]*>.*?</svg>)', src, flags=re.S)

# More reliable: split the source into top/bottom card groups based on the outer rect positions.
# We construct the SVG by extracting each card from its opening rect through its following text.
card_starts = [
    '<rect x="0.5" y="0.5"',
    '<rect x="211.5" y="0.5"',
    '<rect x="422.5" y="0.5"',
    '<rect x="633.5" y="0.5"',
    '<rect x="0.5" y="98.5"',
    '<rect x="211.5" y="98.5"',
    '<rect x="422.5" y="98.5"',
    '<rect x="633.5" y="98.5"',
]

# Find each card block manually from start rect to the next card's start, or </svg>.
blocks = []
for i, start in enumerate(card_starts):
    s = src.find(start)
    if s < 0:
        raise ValueError(f"Missing card start: {start}")
    next_positions = [src.find(x, s + 1) for x in card_starts]
    next_positions = [p for p in next_positions if p > s]
    e = min(next_positions) if next_positions else src.find("</svg>", s)
    blocks.append(src[s:e])

# Desired order: 01,02,03,04=old 04, 05=old 05, 06=old 08
selected = [blocks[0], blocks[1], blocks[2], blocks[3], blocks[4], blocks[7]]

# Transform old 04 top and old 08 bottom left by 211px.
selected[3] = '<g transform="translate(-211 0)">' + selected[3] + '</g>'
selected[5] = '<g transform="translate(-211 0)">' + selected[5] + '</g>'

# Renumber visible labels: old 04 stays 04, old 05 -> 05, old 08 -> 06.
# Actually after removing 06/07, Music should be 05 and English 06.
# The original Music is already 05; English is 08, so only English changes.
selected[5] = selected[5].replace('>08</text>', '>06</text>')

# Build the six-card SVG, 3 columns x 2 rows.
# Shift the bottom row up unchanged (already y=98.5), so layout remains compact.
body = "\n".join(selected)
svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="620" height="182" viewBox="0 0 620 182" shape-rendering="crispEdges" role="img">
<defs></defs>
{body}
</svg>
'''

out = Path("/mnt/data/hobbies_6_cards.svg")
out.write_text(svg, encoding="utf-8")
print(out)
